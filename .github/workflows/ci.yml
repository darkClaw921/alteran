name: ci

# Проверки на каждый пуш и пул-реквест. Публикация (publish.yml) гоняет то же самое,
# но только по тегу, поэтому без этого workflow ошибка всплывала бы в момент релиза.
on:
  push:
    branches: [master, main]
  pull_request:

# Серия пушей в одну ветку делает предыдущие прогоны бессмысленными.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Нижняя граница engines (>=22.5) и текущий LTS: 22 ловит обратную совместимость,
      # 24 — то, на чём собирается релиз.
      matrix:
        node: [22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
